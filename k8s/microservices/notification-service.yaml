apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
data:
  ENVIRONMENT: "development"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis-service:6379"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMS_PROVIDER: "twilio"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
type: Opaque
data:
  SMTP_PASSWORD: ""
  SMTP_USERNAME: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_ACCOUNT_SID: ""
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: notification-service
        image: hotel-reservation:notification-service
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-secret
              key: SMTP_PASSWORD
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: notification-secret
              key: SMTP_USERNAME
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: notification-secret
              key: TWILIO_AUTH_TOKEN
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: notification-secret
              key: TWILIO_ACCOUNT_SID
        envFrom:
        - configMapRef:
            name: notification-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
