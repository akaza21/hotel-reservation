openapi: 3.0.3
info:
  title: Hotel Reservation API
  version: "1.0.0"
  description: >
    REST API powering the hotel-reservation backend. All responses follow the
    `{ success, data, message }` envelope unless otherwise noted.
servers:
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Hotels
  - name: Rooms
  - name: Bookings
paths:
  /health:
    get:
      tags: [Health]
      summary: Service health probe
      responses:
        "200":
          description: Healthy status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics endpoint
      responses:
        "200":
          description: Text-based Prometheus metrics stream
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth:
    post:
      tags: [Auth]
      summary: Authenticate a user and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /api/v1/user:
    get:
      tags: [Users]
      summary: List users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/user/{id}:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: Get user by ID
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: Delete user
      responses:
        "200":
          description: Deleted
  /api/v1/hotel:
    get:
      tags: [Hotels]
      summary: List hotels (paginated)
      parameters:
        - in: query
          name: rating
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Hotels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelsResponse"
  /api/v1/hotel/{id}:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      tags: [Hotels]
      summary: Get hotel details
      responses:
        "200":
          description: Hotel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
  /api/v1/hotel/{id}/rooms:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      tags: [Rooms]
      summary: List rooms in a hotel
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
  /api/v1/room/{id}/book:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    post:
      tags: [Rooms]
      security:
        - bearerAuth: []
      summary: Book a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRoomRequest"
      responses:
        "200":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /api/v1/booking:
    get:
      tags: [Bookings]
      security:
        - bearerAuth: []
      summary: List bookings for current user
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /api/v1/booking/{id}:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      tags: [Bookings]
      security:
        - bearerAuth: []
      summary: Get booking
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /api/v1/booking/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    post:
      tags: [Bookings]
      security:
        - bearerAuth: []
      summary: Cancel booking
      responses:
        "200":
          description: Cancelled booking
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ObjectID:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: MongoDB ObjectID (24 hex characters)
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
        message:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            token:
              type: string
    CreateUserRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
    Hotel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        rating:
          type: integer
        rooms:
          type: array
          items:
            type: string
    HotelsResponse:
      type: object
      properties:
        results:
          type: integer
        page:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
    Room:
      type: object
      properties:
        id:
          type: string
        size:
          type: string
        seaside:
          type: boolean
        price:
          type: number
        hotelID:
          type: string
    Booking:
      type: object
      properties:
        id:
          type: string
        userID:
          type: string
        roomID:
          type: string
        fromDate:
          type: string
          format: date-time
        tillDate:
          type: string
          format: date-time
        numPersons:
          type: integer
        canceled:
          type: boolean
    BookRoomRequest:
      type: object
      required: [fromDate, tillDate, numPersons]
      properties:
        fromDate:
          type: string
          format: date-time
        tillDate:
          type: string
          format: date-time
        numPersons:
          type: integer
